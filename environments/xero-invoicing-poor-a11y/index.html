<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="top-bar" id="topBar">
    <div class="topbar-left">
      <div class="topbar-brand">Xero</div>
    </div>
    <div class="topbar-center">
      <div class="search-bar">
        <input type="text" class="search-input" id="searchInput" />
        <button type="button" class="search-btn" data-action="do-search">&#128269;</button>
      </div>
    </div>
    <div class="topbar-right">
      <div class="topbar-org" id="topBarOrg"></div>
      <div class="topbar-user" id="topBarUser"></div>
    </div>
  </div>

  <div class="sidebar" id="sidebar">
    <div id="sidebarNav"></div>
  </div>

  <div class="main-content" id="mainContent">
    <div id="contentWrapper"></div>
  </div>

  <div id="modalContainer" style="display:none"></div>
  <div id="toastContainer" class="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
  <script src="js/canonical-targets.js"></script>
</body>
</html>
